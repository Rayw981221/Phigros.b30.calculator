<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello phigros !</title>
</head>
<body style="text-align:center;margin-top:20vh;font-family:sans-serif">
  <h1 id="msg">Hello phigros !</h1>
  <button onclick="speak()">🔊 說出來</button>

    function speak() {
      const u = new SpeechSynthesisUtterance("Hello phigros !");
      u.lang = "en-US";
      speechSynthesis.speak(u);
    }
  </script>
